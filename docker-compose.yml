services:
  db:
    image: postgres:16-alpine
    container_name: sales_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-sales_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_nextjs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using the db service hostname}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS application origin}
      UPLOAD_DIR: /app/storage/uploads
      TZ: Asia/Muscat
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - uploads_data:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # ports:
    #   - "3000:3000"
    networks:
      - app_internal
      - docker_shared

  maintenance:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using the db service hostname}
      UPLOAD_DIR: /app/storage/uploads
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    volumes:
      - uploads_data:/app/storage/uploads
    command: ["sh", "-c", "while true; do npx tsx scripts/retention.ts; sleep 86400; done"]
    networks:
      - app_internal

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using the db service hostname}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_data:/backups
    command: ["sh", "-c", "while true; do pg_dump --format=custom --no-owner --no-acl \"$${DATABASE_URL%%\\?*}\" --file=\"/backups/sales-$$(date -u +%Y%m%dT%H%M%SZ).dump\" && find /backups -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete; sleep 86400; done"]
    networks:
      - app_internal

volumes:
  postgres_data:
  uploads_data:
  backup_data:

networks:
  app_internal:
    driver: bridge
  docker_shared:
    external: true
