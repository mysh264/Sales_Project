name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/sales_ci?schema=public"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (max 0 warnings)
        run: npm run lint

      - name: Unit & integration tests
        run: npx tsx --test tests/*.test.ts

      - name: Build
        run: npm run build

  # End-to-end tests require a running Postgres + the app; run locally or in a
  # dedicated workflow with services. Left out of the default CI to keep it fast.
