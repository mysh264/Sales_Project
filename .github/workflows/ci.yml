name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_tracking_test
          POSTGRES_USER: sales_test
          POSTGRES_PASSWORD: sales_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales_test -d sales_tracking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sales_test:sales_test_password@localhost:5432/sales_tracking_test?schema=public
      JWT_SECRET: ci-session-secret-at-least-32-characters
      APP_ORIGIN: http://127.0.0.1:3200
      SEED_ADMIN_PASSWORD: ci-admin-password-not-for-production
      SEED_DEMO_USERS: "true"
      SEED_DEMO_PASSWORD: ci-demo-password-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=moderate
